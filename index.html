<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mosgiel Park Viewer</title>

    <!-- Cesium widget styling -->
    <link
        rel="stylesheet"
        href="https://cesium.com/m/Widgets/widgets.css

    <style>
        html,
        body,
        #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background: #000000;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        #loadingOverlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
            color: #ffffff;
            z-index: 9999;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div id="cesiumContainer"></div>

    <div id="loadingOverlay">
        Loading Mosgiel Park Viewer...
    </div>

    <!-- CesiumJS -->
    <script
        src="https://cesiumjs/releases/1.144/Build/Cesium/Cesium.js    </script>

    <!-- Your application -->
    ./app.jsscript>

    <script>
        window.addEventListener(
            "load",
            function () {
                const loadingOverlay =
                    document.getElementById(
                        "loadingOverlay"
                    );

                if (loadingOverlay) {
                    loadingOverlay.style.display =
                        "none";
                }
            }
        );
    </script>
</body>
</html>
