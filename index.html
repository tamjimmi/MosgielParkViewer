<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mosgiel Park Viewer</title>

    <link
        rel="stylesheet"
        href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css">

    <style>

      {

            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;

        }

        body {

            background: #000000;

        }

        #loadingOverlay {

            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: black;
            color: white;
            z-index: 9999;

        }

    </style>

</head>

<body>

    <div id="cesiumContainer"></div>

    <div id="loadingOverlay">
        Loading Mosgiel Park Viewer...
    </div>

    <script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"><script type="module" src="app.js"></script>

    <script>

        window.addEventListener(
            "load",
            function () {

                document.getElementById(
                    "loadingOverlay"
                ).style.display = "none";

            }
        );

    </script>

</body>

</html>
